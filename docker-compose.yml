version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
  meilisearch:
      image: getmeili/meilisearch:latest
      ports:
        - "7700:7700"
      env_file:
        - .env
      volumes:
        - meili_data:/meili_data
      healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
        interval: 5s
        timeout: 5s
        retries: 5
  ollama:
      image: ollama/ollama
      container_name: ollama
      volumes:
        - ollama:/root/.ollama
      ports:
        - "11434:11434"
volumes:
  redis_data:
  meili_data:
  ollama:
