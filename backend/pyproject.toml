[tool.poetry]
name = "backend"
version = "0.1.0"
description = ""
authors = ["Sanzhar <sanxius.kon@gmail.com>"]
readme = "../README.md"
[tool.poetry.scripts]
start="uvicorn src.main:app --reload"
[tool.poetry.dependencies]
python = ">=3.12,<3.15"
aiogram = "^3.25.0"
fastapi = {extras = ["all"], version = "^0.119.1"}
alembic = "^1.17.0"
pydantic-settings = "^2.11.0"
authlib = "^1.6.5"
pyjwt = "^2.10.1"
jwt = "^1.4.0"
asyncpg = "^0.30.0"
python-jose = {extras = ["cryptography"], version = "^3.5.0"}
aioboto3 = "^15.5.0"
pillow = "^12.0.0"
redis = "^6.2.0"
celery = { version = "^5.6.2", extras = ["redis"] }
meilisearch-python-sdk = "^6.1.0"
openai = "^2.15.0"
faker = "^40.1.2"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]
